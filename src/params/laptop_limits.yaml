system_health_monitor:
  ros__parameters:
    # Temperaturas (°C)
    cpu_temp_warning: 85.0
    cpu_temp_critical: 95.0
    gpu_temp_warning: 80.0
    gpu_temp_critical: 90.0
    disk_temp_warning: 55.0

    # Batería (%)
    battery_warning: 25.0
    battery_critical: 15.0

    # Uso de recursos (%)
    cpu_usage_warning: 90.0
    ram_usage_warning: 90.0

    # Configuración del nodo
    update_period: 2.0  # segundos